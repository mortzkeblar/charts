{{- range $pool := .Values.workers.pools }}
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: {{ include "capmox-talos.fullname" $ }}-{{ $pool.name }}
  labels: 
    {{- include "capmox-talos.labels" $ | nindent 4 }}
  namespace: {{ $.Release.Namespace }}
spec:
  clusterName: {{ include "capmox-talos.clusterName" $ }}
  replicas: {{ $pool.replicas }}
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ include "capmox-talos.clusterName" $ }}
      capmox-talos.io/pool: {{ $pool.name }}
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: {{ include "capmox-talos.clusterName" $ }}
        capmox-talos.io/pool: {{ $pool.name }}
    spec:
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: TalosConfigTemplate
          name: {{ include "capmox-talos.talosConfigTemplateName" (dict "pool" $pool "root" $) }}
      clusterName: {{ include "capmox-talos.clusterName" $ }}
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: ProxmoxMachineTemplate
        name: {{ include "capmox-talos.workerMachineTemplateName" (dict "pool" $pool "root" $)}}
      version: v{{ $.Values.kubernetesVersion}}
{{- end }}
