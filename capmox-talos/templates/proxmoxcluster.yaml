apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxCluster
metadata:
  name: {{ include "capmox-talos.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capmox-talos.labels" . | nindent 4 }}
spec:
  schedulerHints:
    memoryAdjustment: 0
  allowedNodes:
    {{- toYaml .Values.pveNodes | nindent 4 }}
  controlPlaneEndpoint:
    host: {{ .Values.cluster.controlPlane.endpoint }}
    port: {{ .Values.cluster.controlPlane.port | default 6443 }}
  dnsServers:
    {{- toYaml .Values.dnsServers | nindent 4 }}
  ipv4Config:
    addresses:
      {{- toYaml .Values.ipv4Config.addresses | nindent 6 }}
    gateway: {{ .Values.ipv4Config.gateway }}
    prefix: {{ .Values.ipv4Config.prefix }}
