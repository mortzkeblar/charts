---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: {{ include "capmox-talos.controlPlaneMachineTemplateName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capmox-talos.labels" . | nindent 4 }}
spec:
  template:
    spec:
      {{- include "capmox-talos.proxmoxMachineTemplateSpec" .Values.controlPlane.machine | nindent 6 }}


{{- range $pool := .Values.workers.pools }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: {{ include "capmox-talos.workerMachineTemplateName" (dict "pool" $pool "root" $)}}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "capmox-talos.labels" $ | nindent 4}}
spec:
  template:
    spec:
      {{- include "capmox-talos.proxmoxMachineTemplateSpec" $pool | nindent 6 }}
{{- end }}
