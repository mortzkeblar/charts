{{- $seen := dict }}
{{- range $pool := .Values.workers.pools }}
{{- $ctx := dict "pool" $pool "root" $ }}
{{- $name := include "capmox-talos.talosConfigTemplateName" $ctx }}
{{- if not (hasKey $seen $name) }}
{{- $_ := set $seen $name true }}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "capmox-talos.labels" $ | nindent 4 }}
spec:
  template:
    spec:
      generateType: worker
      strategicPatches:
        - |-
{{ include "capmox-talos.talosConfigTemplatePatches" $ctx | indent 10 }}
{{- range $.Values.workers.extraPatches }}
        - |-
{{ . | indent 10 }}
{{- end }}
{{- end }}
{{- end }}
