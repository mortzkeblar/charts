apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: {{ include "capmox-talos.fullname" . }}-control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capmox-talos.labels" . | nindent 4 }}
spec:
  version: v{{ .Values.kubernetesVersion }}
  replicas: {{ .Values.controlPlane.replicas | default 1 }}
  infrastructureTemplate:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
    kind: ProxmoxMachineTemplate
    name: {{ include "capmox-talos.controlPlaneMachineTemplateName" . }}
    namespace: {{ .Release.Namespace }}
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      strategicPatches:
        - |-
          machine:
            kubelet:
              extraArgs:
                cloud-provider: external
                rotate-server-certificates: "true"
            time:
              disabled: false
              servers:
                {{- .Values.controlPlane.timeServers | toYaml | nindent 16 }}
            features:
              kubernetesTalosAPIAccess:
                enabled: true
                allowedRoles:
                  - os:reader
                allowedKubernetesNamespaces:
                  - kube-system
            install:
              disk: /dev/sda
              extraKernelArgs:
                - net.ifnames=0
                - console=ttyS0,115200n8
                - transparent_hugepage=never
            network:
              interfaces:
                - interface: eth0
                  dhcp: false
                  vip:
                    ip: {{ .Values.cluster.controlPlane.endpoint}}
          cluster:
            proxy:
              disabled: true
            network:
              cni:
                name: none
            apiServer:
              extraArgs:
                oidc-issuer-url: https://keycloak.lab.layqavoid.com/realms/master
                oidc-client-id: cluster-cuenca-capmox
                oidc-username-claim: preferred_username
                oidc-username-prefix: "oidc:"
                oidc-groups-claim: groups
                oidc-groups-prefix: "oidc:"
          {{- with .Values.controlPlane.extraPatches }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
