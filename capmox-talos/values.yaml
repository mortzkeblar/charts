nameOverride: ""
fullnameOverride: ""

kubernetesVersion: "1.36.0"

pveNodes:
  - pve

dnsServers:
  - 10.0.24.24

# -- Pool de IPs que CAPMOX asigna a las máquinas (IPAM)
ipv4Config:
  addresses:
    - 10.0.210.232-10.0.210.250
  gateway: 10.0.210.1
  prefix: 24

cluster:
  controlPlane:
    endpoint: 10.0.210.231
    port: 6443
  network:
    pods:
      cidrBlocks:
        - 10.244.0.0/16

controlPlane:
  replicas: 3
  timeServers:
    - 10.0.210.1
  machine:
    templateID: 9001
    pveNode: pve
    cpu:
      cores: 2
      sockets: 1
    memoryMiB: 2048
    storage:
      bootDisk: scsi0
      bootDiskSize: 20
      format: qcow2
      fullClone: true
    network:
      bridge: vmbr1
      vlan: 210
      defaultIPv4: true
    vmIDRange:
      start: 1000
      end: 1100
  extraPatches: []

workers:
  extraPatches: []
  nodeLabels: {}
  pools:
    - name: worker-general
      replicas: 3
      templateID: 9002
      pveNode: pve
      cpu:
        cores: 2
        sockets: 1
      memoryMiB: 4096
      storage:
        bootDisk: scsi0
        bootDiskSize: 20
        format: qcow2
        fullClone: true
      network:
        bridge: vmbr1
        vlan: 210
        defaultIPv4: true
      healthCheck:
        nodeStartupTimeoutSeconds: 360
      vmIDRange:
        start: 1000
        end: 1100
      # -- Labels adicionales solo para este pool (se combinan con workers.nodeLabels)
      nodeLabels: {}
      # -- Taints solo para este pool, formato Talos: key: "value:Effect"
      nodeTaints: {}
