{{- if .Values.config.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "memos.fullname" . }}
  labels:
    {{- include "memos.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $val := .Values.config.secretEnv }}
  {{ $key }}: {{ $val | toString | b64enc }}
  {{- end }}
{{- end }}
