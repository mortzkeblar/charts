{{- $px := .Values.proxmox }}
{{- if not $px.dnsServers }}
{{- fail "proxmox.dnsServers is required" }}
{{- end }}
{{- if not $px.ipv4Pool.addresses }}
{{- fail "proxmox.ipv4Pool.addresses is required" }}
{{- end }}
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxCluster
metadata:
  name: {{ include "proxmox-talos-cluster.clusterName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proxmox-talos-cluster.labels" . | nindent 4 }}
spec:
  allowedNodes:
    {{- toYaml $px.allowedNodes | nindent 4 }}
  {{- with $px.credentialsRef }}
  credentialsRef:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  controlPlaneEndpoint:
    host: {{ .Values.cluster.controlPlaneEndpoint.host }}
    port: {{ .Values.cluster.controlPlaneEndpoint.port }}
  dnsServers:
    {{- toYaml $px.dnsServers | nindent 4 }}
  ipv4Config:
    addresses:
      {{- toYaml $px.ipv4Pool.addresses | nindent 6 }}
    gateway: {{ required "proxmox.ipv4Pool.gateway is required" $px.ipv4Pool.gateway }}
    prefix: {{ $px.ipv4Pool.prefix }}
    {{- with $px.ipv4Pool.metric }}
    metric: {{ . }}
    {{- end }}
  {{- with $px.ipv6Pool }}
  ipv6Config:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $px.schedulerHints }}
  schedulerHints:
    {{- toYaml . | nindent 4 }}
  {{- end }}
