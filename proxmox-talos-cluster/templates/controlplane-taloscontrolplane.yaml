apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: {{ include "proxmox-talos-cluster.clusterName" . }}-control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proxmox-talos-cluster.labels" . | nindent 4 }}
spec:
  version: v{{ .Values.cluster.kubernetesVersion }}
  replicas: {{ .Values.controlPlane.replicas }}
  {{- with .Values.controlPlane.rolloutStrategy }}
  rolloutStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  infrastructureTemplate:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
    kind: ProxmoxMachineTemplate
    name: {{ include "proxmox-talos-cluster.controlPlaneMachineTemplateName" . }}
    namespace: {{ .Release.Namespace }}
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      {{- with include "proxmox-talos-cluster.talosConfigCommon" . | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      strategicPatches:
        - |-
          {{- include "proxmox-talos-cluster.controlPlaneTalosPatch" . | nindent 10 }}
        {{- range .Values.controlPlane.extraPatches }}
        - |-
          {{- . | nindent 10 }}
        {{- end }}
