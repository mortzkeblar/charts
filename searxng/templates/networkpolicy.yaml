{{/* Added in this fork: optional NetworkPolicies for SearXNG and the bundled Valkey. */}}
{{- if .Values.networkPolicy.enabled }}
{{- $egress := .Values.networkPolicy.egress }}
{{- $valkeyPort := dig "service" "port" 6379 .Values.valkey }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "searxng.fullname" . }}
  labels:
    {{- include "searxng.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "searxng.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $egress.enabled }}
  egress:
    {{- if $egress.allowDNS }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- if .Values.valkey.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ $valkeyPort }}
          protocol: TCP
    {{- end }}
    {{- with $egress.rules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- if .Values.valkey.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "searxng.fullname" . }}-valkey
  labels:
    {{- include "searxng.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    # Only SearXNG talks to the bundled Valkey
    - from:
        - podSelector:
            matchLabels:
              {{- include "searxng.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ $valkeyPort }}
          protocol: TCP
{{- end }}
{{- end }}
