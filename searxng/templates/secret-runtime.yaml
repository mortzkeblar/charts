{{/* Altered from techpipe-io/searxng-helm-chart: SEARXNG_VALKEY_URL now comes
     from externalValkey.* / searxng.valkeyUrl instead of the inline Valkey values. */}}
{{- if eq (include "searxng.createRuntimeEnvSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "searxng.runtimeEnvSecretName" . }}
  labels:
    {{- include "searxng.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (or .Values.secret.create .Values.secret.value) (not .Values.secret.existingSecret) (not (hasKey .Values.env.values "SEARXNG_SECRET")) (not (hasKey .Values.env.secretValues "SEARXNG_SECRET")) }}
  SEARXNG_SECRET: {{ include "searxng.searxngSecretValue" . | quote }}
  {{- end }}
  {{- if and (not (hasKey .Values.env.values "SEARXNG_VALKEY_URL")) (not (hasKey .Values.env.secretValues "SEARXNG_VALKEY_URL")) (not .Values.externalValkey.urlSecret.name) (or .Values.externalValkey.url .Values.valkey.enabled) }}
  SEARXNG_VALKEY_URL: {{ include "searxng.valkeyUrl" . | quote }}
  {{- end }}
  {{- range $k, $v := .Values.env.secretValues }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
